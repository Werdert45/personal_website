services:
  db:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    platform: linux/amd64
    working_dir: /app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,ianronk.nl,api.ianronk.nl
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
      - CSRF_TRUSTED_ORIGINS=https://api.ianronk.nl
      # Demo seeding is OPT-IN: the seeded articles/posts are sample content and
      # must never reach the live site (they publish under the real byline).
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # Optional static key for programmatic content management (X-API-Key);
      # unset = disabled, JWT only. See BLOG_IMPLEMENTATION.md.
      - CONTENT_API_KEY=${CONTENT_API_KEY:-}
      - INTERNAL_PROXY_SECRET=${INTERNAL_PROXY_SECRET:-}
      - CHAT_RATE_PER_MIN=${CHAT_RATE_PER_MIN:-10}
      - CHAT_DAILY_LIMIT=${CHAT_DAILY_LIMIT:-500}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python manage.py seed_data --demo; fi &&
             (python manage.py seed_chat_kb || echo 'seed_chat_kb failed - chat KB unavailable') &&
             (python manage.py seed_beta_content || echo 'seed_beta_content failed - beta content not seeded') &&
             gunicorn --bind 0.0.0.0:8001 config.wsgi:application"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    platform: linux/amd64
    environment:
      - DJANGO_API_URL=http://backend:8001
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - INTERNAL_PROXY_SECRET=${INTERNAL_PROXY_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
