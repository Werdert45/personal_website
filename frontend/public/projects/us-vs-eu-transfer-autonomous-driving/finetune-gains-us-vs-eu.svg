<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Grouped bar chart: gain in shared-class mAP over zero-shot baseline. Fine-tuning on US data helps only on the US test set; fine-tuning on EU data helps only on the EU test set. On the EU test set YOLOv8s gains +0.153 from EU fine-tuning and +0.001 from US fine-tuning.">
  <rect x="0" y="0" width="920" height="500" fill="#FCFBF7"/>

  <!-- Title block -->
  <text x="70" y="38" font-size="18" font-weight="700" fill="#111110">Fine-tuning only helps on its own side of the Atlantic</text>
  <text x="70" y="60" font-size="12.5" fill="#111110">Gain in shared-class mAP@0.5:0.95 (car / person / bicycle) over the zero-shot COCO baseline. Fine-tuned cells are seed means.</text>

  <!-- Legend -->
  <rect x="592" y="20" width="12" height="12" rx="3" fill="#FFD60A"/>
  <text x="610" y="30" font-size="12" fill="#111110">Fine-tuned on US data</text>
  <rect x="748" y="20" width="12" height="12" rx="3" fill="#111110"/>
  <text x="766" y="30" font-size="12" fill="#111110">Fine-tuned on EU data</text>

  <!-- Gridlines (both panels) -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="110" y1="146.1" x2="430" y2="146.1"/><line x1="570" y1="146.1" x2="890" y2="146.1"/>
    <line x1="110" y1="211.3" x2="430" y2="211.3"/><line x1="570" y1="211.3" x2="890" y2="211.3"/>
    <line x1="110" y1="276.5" x2="430" y2="276.5"/><line x1="570" y1="276.5" x2="890" y2="276.5"/>
    <line x1="110" y1="407.0" x2="430" y2="407.0"/><line x1="570" y1="407.0" x2="890" y2="407.0"/>
  </g>
  <!-- Zero baselines -->
  <g stroke="#c3c2b7" stroke-width="1.5">
    <line x1="110" y1="342" x2="430" y2="342"/>
    <line x1="570" y1="342" x2="890" y2="342"/>
  </g>

  <!-- Y tick labels (shared scale, labeled once) -->
  <g font-size="11" fill="#8A8676" text-anchor="end">
    <text x="100" y="150">+0.15</text>
    <text x="100" y="215">+0.10</text>
    <text x="100" y="280">+0.05</text>
    <text x="100" y="346">0</text>
    <text x="100" y="411">&#8722;0.05</text>
  </g>

  <!-- Panel titles -->
  <text x="270" y="100" font-size="14" font-weight="600" fill="#111110" text-anchor="middle">Tested on US streets (Udacity)</text>
  <text x="730" y="100" font-size="14" font-weight="600" fill="#111110" text-anchor="middle">Tested on EU streets (KITTI)</text>

  <!-- US-test panel: YOLOv3u group -->
  <path d="M155,342 L155,299 Q155,295 159,295 L185,295 Q189,295 189,299 L189,342 Z" fill="#FFD60A"/>
  <path d="M191,342 L191,392.8 Q191,396.8 195,396.8 L221,396.8 Q225,396.8 225,392.8 L225,342 Z" fill="#111110"/>
  <!-- US-test panel: YOLOv8s group -->
  <path d="M315,342 L315,244.3 Q315,240.3 319,240.3 L345,240.3 Q349,240.3 349,244.3 L349,342 Z" fill="#FFD60A"/>
  <path d="M351,342 L351,357.6 Q351,361.6 355,361.6 L381,361.6 Q385,361.6 385,357.6 L385,342 Z" fill="#111110"/>

  <!-- EU-test panel: YOLOv3u group -->
  <path d="M615,342 L615,386.3 Q615,390.3 619,390.3 L645,390.3 Q649,390.3 649,386.3 L649,342 Z" fill="#FFD60A"/>
  <path d="M651,342 L651,173.8 Q651,169.8 655,169.8 L681,169.8 Q685,169.8 685,173.8 L685,342 Z" fill="#111110"/>
  <!-- EU-test panel: YOLOv8s group (US-ft bar is a 1px sliver: +0.001) -->
  <rect x="775" y="340.7" width="34" height="1.3" fill="#FFD60A"/>
  <path d="M811,342 L811,146.4 Q811,142.4 815,142.4 L841,142.4 Q845,142.4 845,146.4 L845,342 Z" fill="#111110"/>

  <!-- Value labels -->
  <g font-size="11.5" fill="#111110" text-anchor="middle">
    <text x="172" y="288">+0.036</text>
    <text x="208" y="411">&#8722;0.042</text>
    <text x="332" y="233">+0.078</text>
    <text x="368" y="376">&#8722;0.015</text>
    <text x="632" y="404">&#8722;0.037</text>
    <text x="668" y="163">+0.132</text>
  </g>
  <g font-size="11.5" font-weight="700" fill="#111110" text-anchor="middle">
    <text x="786" y="333">+0.001</text>
    <text x="828" y="135">+0.153</text>
  </g>

  <!-- Group labels -->
  <g font-size="12" fill="#8A8676" text-anchor="middle">
    <text x="190" y="444">YOLOv3u</text>
    <text x="350" y="444">YOLOv8s</text>
    <text x="650" y="444">YOLOv3u</text>
    <text x="810" y="444">YOLOv8s</text>
  </g>

  <!-- Footnote -->
  <text x="70" y="480" font-size="11" fill="#8A8676">EU test set held out from all training and model selection. Difference-in-differences across 3 seeds: &#916; = +0.077 &#177; 0.007 (YOLOv8s).</text>
</svg>
